name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, coverage and SonarQube
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CALORIE_DB_HOST: 127.0.0.1
      CALORIE_DB_PORT: "5433"
      CALORIE_DB_NAME: calorie_tracker
      CALORIE_DB_USER: calorie_app
      CALORIE_DB_PASSWORD: ci_only_password

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: calorie_tracker
          POSTGRES_USER: calorie_app
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - "127.0.0.1:5433:5432"
        options: >-
          --health-cmd "pg_isready -U calorie_app -d calorie_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.lock

      - name: Install backend dependencies
        run: |
          python -m pip install \
            --only-binary :all: \
            --require-hashes \
            -r backend/requirements-ci.lock

      - name: Check backend dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q backend/app

      - name: Apply and check database migrations
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini check

      - name: Run backend tests with coverage
        run: |
          python -m pytest \
            --cov \
            --cov-config=pyproject.toml \
            --cov-report=term-missing \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=json:backend/coverage.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend lint
        run: npm --prefix frontend run lint

      - name: Check TypeScript and build
        run: npm --prefix frontend run build

      - name: Run frontend tests with coverage
        run: npm --prefix frontend run test:coverage

      - name: Check reports and enforce 80% combined line and branch coverage
        run: |
          test -s backend/coverage.xml
          test -s frontend/coverage/lcov.info
          python scripts/check_coverage.py

      - name: Validate SonarQube configuration
        id: sonar_config
        if: >-
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          : "${SONAR_TOKEN:?Set the SONAR_TOKEN repository secret}"
          : "${SONAR_ORGANIZATION:?Set the SONAR_ORGANIZATION Actions variable}"
          : "${SONAR_PROJECT_KEY:?Set the SONAR_PROJECT_KEY Actions variable}"

      - name: Run SonarQube analysis and quality gate
        if: steps.sonar_config.outcome == 'success'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Build and smoke-test the deployment image
        run: |
          set -euo pipefail
          docker build --tag calorie-tracker:ci .
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              docker logs calorie-tracker-smoke || true
            fi
            docker rm --force calorie-tracker-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name calorie-tracker-smoke --network host \
            --env CALORIE_DB_HOST --env CALORIE_DB_PORT \
            --env CALORIE_DB_NAME --env CALORIE_DB_USER --env CALORIE_DB_PASSWORD \
            --env PORT=18001 --env APP_ORIGIN=http://127.0.0.1:18001 \
            calorie-tracker:ci
          python scripts/check_deployment.py http://127.0.0.1:18001
