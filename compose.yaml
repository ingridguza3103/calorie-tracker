name: calorie-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: calorie_tracker
      POSTGRES_USER: calorie_app
      POSTGRES_PASSWORD: ${CALORIE_DB_PASSWORD:?Set CALORIE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - calorie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorie_app -d calorie_tracker"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  calorie_pgdata: